<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Belajar & Evaluasi - KITA SEBAYA</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="assets/js/dflip-config.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/css/dflip.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/css/themify-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/js/dflip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/common.js"></script>

    <link rel="stylesheet" href="assets/css/buku.css">
</head>
<body class="flex flex-col min-h-screen relative">

    <div id="nav-atas" class="absolute top-4 left-4 right-4 flex justify-between z-[60] pointer-events-none">
        <button onclick="keluarKeBeranda()" class="pointer-events-auto bg-slate-800/80 backdrop-blur hover:bg-slate-700 text-white px-4 py-2 rounded-lg font-bold shadow-lg transition flex items-center gap-2 text-sm border border-slate-600"><i class="fa-solid fa-arrow-left"></i> Keluar</button>
        <button id="btn-selesai" onclick="tampilkanKonfirmasiSelesai()" class="hidden pointer-events-auto bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-bold shadow-lg transition items-center gap-2 text-sm border border-emerald-500"><i class="fa-solid fa-check-double"></i> Selesai Membaca</button>
    </div>

    <div id="wadah-buku" class="w-full h-full flex items-center justify-center absolute inset-0 z-10 transition-opacity duration-500">
        <div class="text-white flex flex-col items-center gap-3"><i class="fa-solid fa-spinner fa-spin text-3xl text-rose-500"></i><p class="font-medium">Menyiapkan modul...</p></div>
    </div>

    <div id="wadah-ujian" class="w-full h-full bg-[#f8fafc] flex items-start justify-center p-4 md:p-8 absolute inset-0 z-20 hidden overflow-y-auto">
        <div class="bg-white rounded-3xl shadow-xl w-full max-w-4xl quiz-enter overflow-hidden flex flex-col mt-12 mb-12">
            <div class="bg-indigo-700 text-white px-6 py-4 flex justify-between items-center">
                <h2 class="font-display font-bold text-lg" id="header-judul-kuis"><i class="fa-solid fa-pen-clip mr-2"></i> Lembar Evaluasi</h2>
            </div>
            <div class="p-6 md:p-8 flex-1">
                <div id="quiz-content" class="space-y-6">
                    <div class="text-center py-10"><i class="fa-solid fa-circle-notch fa-spin text-4xl text-rose-500 mb-4"></i><p class="text-slate-500">Memuat instrumen...</p></div>
                </div>
            </div>
            <div id="quiz-footer" class="p-6 bg-slate-50 border-t border-slate-200"></div>
        </div>
    </div>

    <div id="modalSelesai" class="hidden fixed inset-0 bg-slate-900/90 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm modal-enter p-8 text-center relative overflow-hidden">
            <div class="w-20 h-20 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-4"><i class="fa-solid fa-book-open-reader"></i></div>
            <h3 class="font-display text-2xl font-bold text-slate-900 mb-2">Modul selesai! 🎉</h3>
            <p id="teks-selesai" class="text-slate-500 text-sm mb-6">Hebat! Kamu telah menyelesaikan materi ini.</p>
            <div class="flex flex-col gap-3">
                <button id="btn-lanjut-kuis" class="btn-pop w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3.5 hidden" style="--btn-pop-shadow:#432574">Mulai evaluasi / kuis</button>
                <button onclick="keluarKeBeranda()" id="btn-tutup-modul" class="btn-pop w-full bg-rose-600 hover:bg-rose-500 text-white py-3.5 hidden" style="--btn-pop-shadow:#7b221b">Kembali ke menu utama</button>
                <button onclick="tutupModalSelesai()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3.5 rounded-xl transition">Baca ulang modul</button>
            </div>
        </div>
    </div>

    <!-- Panel baca otomatis: tersembunyi sampai teks PDF siap diekstrak & browser mendukung Web Speech API -->
    <div id="tts-panel" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 z-50 w-[calc(100%-2rem)] max-w-md">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 pl-3 pr-3 py-2.5 flex items-center gap-3">
            <button id="tts-play" type="button" onclick="tombolPlayTTS()" class="w-11 h-11 shrink-0 rounded-full bg-rose-600 hover:bg-rose-500 text-white flex items-center justify-center text-base shadow transition active:scale-95" title="Dengarkan modul ini">
                <i id="tts-play-icon" class="fa-solid fa-volume-high"></i>
            </button>
            <div class="min-w-0 flex-1">
                <p id="tts-status" class="text-[13px] font-bold text-slate-800 truncate">Dengarkan modul ini</p>
                <div class="flex items-center gap-1.5 mt-0.5">
                    <span id="tts-equalizer" class="hidden items-end gap-[2px] h-2.5 shrink-0"><span></span><span></span><span></span></span>
                    <p id="tts-halaman" class="text-[11px] text-slate-500 truncate">Suara dibuat otomatis dari teks PDF</p>
                </div>
            </div>
            <select id="tts-speed" onchange="ubahKecepatanBaca(this.value)" class="hidden sm:block text-xs font-bold text-slate-600 bg-slate-100 rounded-lg pl-2 pr-1 py-2 border-0 outline-none shrink-0" title="Kecepatan membaca">
                <option value="0.85">0.85×</option>
                <option value="1" selected>1×</option>
                <option value="1.25">1.25×</option>
                <option value="1.5">1.5×</option>
            </select>
            <button id="tts-stop" type="button" onclick="hentikanTTS()" class="hidden shrink-0 w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 items-center justify-center transition" title="Hentikan bacaan"><i class="fa-solid fa-stop text-xs"></i></button>
        </div>
    </div>

    <script src="assets/js/pages/buku.js"></script>
</body>
</html>
